<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUN</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05050f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    user-select: none;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 800px;
    padding: 0.5rem 0.25rem 0.2rem;
  }
  .hud-item { font-family: 'Orbitron', monospace; font-size: 0.75rem; color: #0ff; letter-spacing: 0.1em; }
  .hud-val { font-size: 1.1rem; font-weight: 900; color: #fff; }
  #boss-hud { display: none; width: 800px; padding: 0 0.25rem 0.3rem; }
  #boss-hud-inner { display: flex; align-items: center; gap: 10px; }
  #boss-label {
    font-family: 'Orbitron', monospace; font-size: 0.6rem; color: #f33;
    letter-spacing: 0.12em; white-space: nowrap;
    animation: bossLabelPulse 1s infinite;
  }
  @keyframes bossLabelPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  #boss-track { flex:1; height:10px; background:#1a0a0a; border:1px solid rgba(255,51,51,0.4); border-radius:99px; overflow:hidden; }
  #boss-fill { height:100%; width:100%; background:linear-gradient(90deg,#f33,#f80); border-radius:99px; transition:width 0.15s; }
  #boss-hp-text { font-family:'Orbitron',monospace; font-size:0.65rem; font-weight:700; color:#f33; min-width:40px; text-align:right; }
  #canvas-wrap {
    position: relative;
    border: 1px solid rgba(0,255,255,0.2);
    box-shadow: 0 0 40px rgba(0,255,255,0.1), 0 0 80px rgba(0,255,255,0.05);
  }
  canvas { display: block; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,5,15,0.88); backdrop-filter: blur(4px);
  }
  #overlay h1 {
    font-family: 'Orbitron', monospace; font-size: 3rem; font-weight: 900; color: #0ff;
    text-shadow: 0 0 20px #0ff, 0 0 60px rgba(0,255,255,0.4);
    letter-spacing: 0.15em; margin-bottom: 0.5rem;
  }
  .tagline { font-size:0.75rem; color:rgba(0,255,255,0.5); letter-spacing:0.25em; margin-bottom:2.5rem; }
  .instructions { font-size:0.7rem; color:rgba(255,255,255,0.4); text-align:center; line-height:2; margin-bottom:2rem; letter-spacing:0.08em; }
  .start-btn {
    font-family:'Orbitron',monospace; font-size:0.85rem; font-weight:700; letter-spacing:0.2em;
    padding:0.75rem 2.5rem; background:transparent; border:1px solid #0ff; color:#0ff;
    cursor:pointer; text-transform:uppercase; transition:all 0.2s; box-shadow:0 0 12px rgba(0,255,255,0.2);
  }
  .start-btn:hover { background:rgba(0,255,255,0.1); box-shadow:0 0 24px rgba(0,255,255,0.4); }
  #powerup-bar {
    display:flex; gap:8px; align-items:center;
    width:800px; padding:0 0.25rem 0.2rem; min-height:28px;
  }
  .pu-chip {
    font-family:'Orbitron',monospace; font-size:0.55rem; letter-spacing:0.08em;
    padding:3px 8px; border-radius:99px; border:1px solid; display:flex; align-items:center; gap:5px;
    animation: puPulse 1s infinite;
  }
  .pu-timer { width:40px; height:3px; border-radius:99px; background:rgba(255,255,255,0.15); overflow:hidden; }
  .pu-timer-fill { height:100%; border-radius:99px; transition:width 0.1s; }
  @keyframes puPulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

  /* ── Cheat Modal ── */
  #cheat-modal {
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
  }
  #cheat-modal.open { display: flex; }
  #cheat-box {
    background: #0a0a14;
    border: 1px solid rgba(0,255,0,0.4);
    box-shadow: 0 0 40px rgba(0,255,0,0.15);
    border-radius: 14px;
    padding: 1.75rem 2rem;
    width: 340px;
    font-family: 'Share Tech Mono', monospace;
  }
  #cheat-box h2 {
    font-family: 'Orbitron', monospace;
    font-size: 0.9rem; font-weight: 900;
    color: #0f0; letter-spacing: 0.2em;
    margin-bottom: 0.25rem;
  }
  #cheat-box .cheat-sub {
    font-size: 0.6rem; color: rgba(0,255,0,0.4);
    letter-spacing: 0.15em; margin-bottom: 1.25rem;
  }
  .cheat-grid {
    display: grid; grid-template-columns: repeat(5,1fr); gap: 7px;
    margin-bottom: 1.25rem;
  }
  .cheat-lvl-btn {
    padding: 0.5rem 0;
    background: rgba(0,255,0,0.06);
    border: 1px solid rgba(0,255,0,0.25);
    border-radius: 8px;
    color: #0f0; font-family: 'Orbitron', monospace;
    font-size: 0.7rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    text-align: center;
  }
  .cheat-lvl-btn:hover {
    background: rgba(0,255,0,0.18);
    box-shadow: 0 0 10px rgba(0,255,0,0.3);
  }
  .cheat-lvl-btn.current {
    border-color: #0f0; color: #0f0;
    background: rgba(0,255,0,0.15);
    box-shadow: 0 0 8px rgba(0,255,0,0.3);
  }
  #cheat-cancel {
    width: 100%; padding: 0.55rem;
    background: transparent; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; color: rgba(255,255,255,0.35);
    font-family: 'Share Tech Mono', monospace; font-size: 0.7rem;
    cursor: pointer; letter-spacing: 0.1em; transition: all 0.15s;
  }
  #cheat-cancel:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); }
  .mode-btns { display:flex; gap:14px; margin-bottom:1.5rem; flex-wrap:wrap; justify-content:center; }
  .mode-btn {
    font-family:'Orbitron',monospace; font-size:0.8rem; font-weight:700; letter-spacing:0.15em;
    padding:0.7rem 1.6rem; background:transparent; border:1px solid #0ff; color:#0ff;
    cursor:pointer; text-transform:uppercase; transition:all 0.2s;
  }
  .mode-btn:hover { background:rgba(0,255,255,0.1); }
  .mode-btn.active { background:rgba(0,255,255,0.18); box-shadow:0 0 16px rgba(0,255,255,0.4); }
  #lobby-area { text-align:center; margin-bottom:1.2rem; }
  #lobby-area input {
    font-family:'Orbitron',monospace; font-size:1.4rem; font-weight:900; letter-spacing:0.25em;
    background:transparent; border:none; border-bottom:2px solid #0ff; color:#fff;
    text-align:center; width:120px; outline:none; text-transform:uppercase; padding:0.2rem 0;
  }
  #lobby-area input::placeholder { color:rgba(0,255,255,0.25); }
  .lobby-label { font-size:0.6rem; color:rgba(0,255,255,0.5); letter-spacing:0.2em; text-transform:uppercase; margin-bottom:0.4rem; }
  #lobby-status { font-size:0.68rem; min-height:1.2rem; letter-spacing:0.1em; margin-top:0.5rem; }
  #p2-hud { font-family:'Orbitron',monospace; font-size:0.75rem; color:#f0f; letter-spacing:0.1em; }

  /* ── Mobile scaling ── */
  #game-root {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  #scale-wrap {
    transform-origin: top center;
  }
  #hud { width: 800px; }
  #boss-hud { width: 800px; }

  /* ── D-pad ── */
  #dpad {
    display: none;
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  #dpad.visible { display: flex; }
  .dpad-group { display: flex; gap: 8px; pointer-events: all; }
  .dpad-btn {
    width: 62px; height: 62px;
    background: rgba(0,255,255,0.08);
    border: 1.5px solid rgba(0,255,255,0.35);
    border-radius: 14px;
    color: #0ff;
    font-size: 1.4rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    transition: background 0.1s;
    box-shadow: 0 0 10px rgba(0,255,255,0.1);
  }
  .dpad-btn:active, .dpad-btn.pressed {
    background: rgba(0,255,255,0.22);
    box-shadow: 0 0 18px rgba(0,255,255,0.3);
  }
  .dpad-jump {
    width: 72px; height: 72px;
    background: rgba(0,255,255,0.1);
    border-color: rgba(0,255,255,0.5);
    border-radius: 50%;
    font-size: 1.6rem;
  }

  /* portrait nudge */
  #portrait-msg {
    display: none;
    position: fixed; inset: 0; z-index: 999;
    background: #05050f;
    flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace; color: #0ff; text-align: center; gap: 1rem;
  }
  #portrait-msg.show { display: flex; }
  #portrait-msg .icon { font-size: 3rem; animation: spin 2s linear infinite; }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  #portrait-msg p { font-size: 0.75rem; letter-spacing: 0.15em; color: rgba(0,255,255,0.6); }

  @media (hover: none) {
    /* touch device — show dpad when game running */
    .start-btn { padding: 1rem 2rem; font-size: 0.9rem; }
  }
</style>
</head>
<body>
<div id="portrait-msg">
  <div class="icon">📱</div>
  <div style="font-size:1.2rem;font-weight:900;letter-spacing:0.15em;">ROTATE DEVICE</div>
  <p>NEON RUN plays best in landscape</p>
</div>
<div id="game-root">
<div id="scale-wrap">
<div id="hud">
  <div class="hud-item">SCORE<br><span class="hud-val" id="hud-score">0</span></div>
  <div class="hud-item" style="text-align:center;">LEVEL<br><span class="hud-val" id="hud-level">1</span></div>
  <div class="hud-item" style="text-align:right;">LIVES<br><span class="hud-val" id="hud-lives">♦ ♦ ♦</span></div>
  <div class="hud-item" id="p2-hud-item" style="display:none;text-align:right;color:#f0f;">P2<br><span class="hud-val" id="hud-p2-status" style="color:#f0f;">⬡</span></div>
</div>
<div id="boss-hud">
  <div id="boss-hud-inner">
    <span id="boss-label">☠ OVERLORD</span>
    <div id="boss-track"><div id="boss-fill"></div></div>
    <span id="boss-hp-text">10/10</span>
  </div>
</div>
<div id="powerup-bar"></div>
<div id="canvas-wrap">
  <canvas id="c" width="800" height="440"></canvas>
  <div id="overlay">
    <h1>NEON RUN</h1>
    <div class="tagline">SURVIVE THE GRID</div>
    <div class="instructions" id="instructions"></div>
    <script>
      (function(){
        const mobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        document.getElementById('instructions').innerHTML = mobile
          ? 'TAP ◀ ▶ to move &amp; ▲ to jump &nbsp;|&nbsp; Stomp enemies<br>Collect all orbs to advance &nbsp;|&nbsp; Level 10: BOSS fight!'
          : 'ARROW KEYS or WASD — move &amp; jump &nbsp;|&nbsp; Stomp enemies<br>Collect all orbs to advance &nbsp;|&nbsp; Level 10: BOSS fight!';
      })();
    </script>
    <div class="mode-btns">
      <button class="mode-btn active" id="btn-1p" onclick="selectMode(1)">1 PLAYER</button>
      <button class="mode-btn"        id="btn-2p" onclick="selectMode(2)">2 PLAYER</button>
    </div>
    <div id="lobby-area" style="display:none;">
      <!-- Host or Join toggle -->
      <div class="mode-btns" id="hj-toggle">
        <button class="mode-btn active" id="btn-host" onclick="switchLobby('host')">HOST GAME</button>
        <button class="mode-btn"        id="btn-join" onclick="switchLobby('join')">JOIN GAME</button>
      </div>

      <div id="host-panel" style="display:none;">
        <div class="lobby-label">Your room code — share this with your friend</div>
        <div style="font-family:'Orbitron',monospace;font-size:2.2rem;font-weight:900;color:#0ff;letter-spacing:0.35em;margin:0.5rem 0;" id="room-code-display">----</div>
        <div id="host-status" style="font-size:0.68rem;letter-spacing:0.1em;min-height:1.2rem;color:rgba(0,255,255,0.5);">Generating code…</div>
      </div>

      <div id="join-panel" style="display:none;">
        <div class="lobby-label">Enter the 4-letter code from your friend</div>
        <input id="code-input" maxlength="4" placeholder="XXXX"
               oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"
               onkeydown="if(event.key==='Enter')joinRoom()">
        <br><br>
        <button class="start-btn" onclick="joinRoom()" style="font-size:0.75rem;padding:0.6rem 1.8rem;">CONNECT</button>
        <div id="join-status" style="font-size:0.68rem;letter-spacing:0.1em;min-height:1.2rem;margin-top:0.5rem;color:rgba(255,0,255,0.6);"></div>
      </div>
    </div>
    <button class="start-btn" id="insert-coin-btn" onclick="startGame()">INSERT COIN</button>
  </div>
  <div id="dpad">
    <div class="dpad-group">
      <div class="dpad-btn" id="btn-left" ontouchstart="dpadDown('left')" ontouchend="dpadUp('left')" onmousedown="dpadDown('left')" onmouseup="dpadUp('left')">◀</div>
      <div class="dpad-btn" id="btn-right" ontouchstart="dpadDown('right')" ontouchend="dpadUp('right')" onmousedown="dpadDown('right')" onmouseup="dpadUp('right')">▶</div>
    </div>
    <div class="dpad-group">
      <div class="dpad-btn dpad-jump" id="btn-jump" ontouchstart="dpadDown('jump')" ontouchend="dpadUp('jump')" onmousedown="dpadDown('jump')" onmouseup="dpadUp('jump')">▲</div>
    </div>
  </div>
</div>
</div>
</div>
<div id="cheat-modal">
  <div id="cheat-box">
    <h2>⌨ ADMIN WARP</h2>
    <div class="cheat-sub">CTRL + 3 &nbsp;|&nbsp; SELECT LEVEL</div>
    <div class="cheat-grid" id="cheat-grid"></div>
    <button id="cheat-cancel" onclick="closeCheat()">CANCEL</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GRAVITY = 0.55, PLAYER_SPEED = 4.2, JUMP_FORCE = -12.5, BOSS_MAX_HP = 10;
let state, keys = {}, animId, bgStars;

// ─── POWERUP DEFINITIONS ──────────────────────────────────────
const POWERUP_TYPES = [
  { id:'speed',    label:'SPEED',    icon:'⚡', color:'#ff0',  border:'#cc0',  dur:300, desc:'Speed Boost' },
  { id:'shield',   label:'SHIELD',   icon:'🛡', color:'#0ff',  border:'#0aa',  dur:360, desc:'Shield' },
  { id:'triple',   label:'3-JUMP',   icon:'△',  color:'#f0f',  border:'#a0a',  dur:400, desc:'Triple Jump' },
  { id:'multi',    label:'2× SCORE', icon:'★',  color:'#ffa',  border:'#aa8',  dur:350, desc:'Score ×2' },
  { id:'shrink',   label:'SHRINK',   icon:'↘',  color:'#8ff',  border:'#088',  dur:280, desc:'Shrink Enemies' },
  { id:'magnet',   label:'MAGNET',   icon:'◉',  color:'#f8a',  border:'#a44',  dur:320, desc:'Coin Magnet' },
];

// ═══════════════════════════════════════════════════════════════
// MULTIPLAYER STATE
// ═══════════════════════════════════════════════════════════════
let gameMode = 1;          // 1 or 2
let mpRole   = null;       // 'host' or 'join'
let peer     = null;
let mpConn   = null;
let p2       = null;       // remote player state {x,y,vx,vy,invincible,onGround,jumpsLeft,trail,w,h}
let p2Keys   = {};         // remote keys (received over network)
let mpReady  = false;
let lastSendTime = 0;
let p2LevelReady = false; // true when P2 has also cleared all coins

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:4}, ()=>chars[Math.floor(Math.random()*chars.length)]).join('');
}

function selectMode(m) {
  gameMode = m;
  document.getElementById('btn-1p').classList.toggle('active', m===1);
  document.getElementById('btn-2p').classList.toggle('active', m===2);
  const lobby = document.getElementById('lobby-area');
  const coinBtn = document.getElementById('insert-coin-btn');
  if(m===1){
    lobby.style.display='none';
    coinBtn.style.display='';
  } else {
    lobby.style.display='block';
    coinBtn.style.display='none';
    switchLobby('host'); // default to host view
  }
}

function switchLobby(role) {
  mpRole = role;
  document.getElementById('btn-host').classList.toggle('active', role==='host');
  document.getElementById('btn-join').classList.toggle('active', role==='join');
  document.getElementById('host-panel').style.display = role==='host' ? 'block' : 'none';
  document.getElementById('join-panel').style.display = role==='join' ? 'block' : 'none';
  if(role==='host') initPeer('host');
  else {
    // Stop any existing peer so host doesn't hold a dead slot
    if(peer){ try{peer.destroy();}catch(e){} peer=null; }
    setHostStatus('','');
  }
}

// PeerJS config with public STUN + TURN for fast ICE on all networks
const PEER_CFG = {
  debug: 0,
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
      // Open TURN relay (numb.viagenie.ca) — fallback for strict NAT
      { urls:'turn:openrelay.metered.ca:80',   username:'openrelayproject', credential:'openrelayproject' },
      { urls:'turn:openrelay.metered.ca:443',  username:'openrelayproject', credential:'openrelayproject' },
      { urls:'turn:openrelay.metered.ca:443?transport=tcp', username:'openrelayproject', credential:'openrelayproject' }
    ],
    iceCandidatePoolSize: 10
  }
};

function initPeer(role) {
  if(peer){ try{peer.destroy();}catch(e){} peer=null; }
  document.getElementById('room-code-display').textContent='...';
  setHostStatus('Connecting…','rgba(0,255,255,0.4)');

  const code = genCode();
  peer = new Peer('neonrun-'+code, PEER_CFG);

  peer.on('open', id => {
    const roomCode = id.replace('neonrun-','');
    document.getElementById('room-code-display').textContent = roomCode;
    setHostStatus('Waiting for Player 2…','rgba(0,255,255,0.6)');
    peer.on('connection', conn => {
      mpConn = conn;
      setupConn();
    });
  });

  peer.on('error', err => {
    if(err.type==='unavailable-id'){ initPeer('host'); return; }
    setHostStatus('Error: '+err.type+' — try refreshing','#f33');
  });
}

function joinRoom() {
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  if(code.length!==4){ setJoinStatus('Enter a 4-letter code','#f80'); return; }
  mpRole='join';
  setJoinStatus('Connecting…','#ff0');
  if(peer){ try{peer.destroy();}catch(e){} peer=null; }

  // Create peer then connect immediately in the open handler
  peer = new Peer(PEER_CFG);
  peer.on('open', ()=>{
    // Use reliable:true + default serialization for fastest stable connection
    mpConn = peer.connect('neonrun-'+code, { reliable: true });
    setupConn();
  });
  peer.on('error', e=>{
    const msg = e.type==='peer-unavailable'
      ? 'Code not found — check it and try again'
      : 'Connection failed: '+e.type;
    setJoinStatus(msg,'#f33');
  });
}

function setupConn() {
  mpConn.on('open', ()=>{
    mpReady = true;
    if(mpRole==='host'){
      setHostStatus('Player 2 connected! Starting…','#0f8');
      // Send start signal then launch immediately — no artificial delay
      mpConn.send({type:'start'});
      startGame();
    } else {
      setJoinStatus('Connected! Starting…','#0f8');
      // P2 starts immediately on receiving 'start' via handleMpData
    }
  });
  mpConn.on('data', handleMpData);
  mpConn.on('close', ()=>{ mpReady=false; p2=null; setJoinStatus('Disconnected','#888'); });
  mpConn.on('error', e=>console.warn('conn err',e));
}

function handleMpData(data) {
  if(!data||!data.type) return;
  switch(data.type){
    case 'start':
      if(mpRole==='join') startGame();
      break;
    case 'state':
      p2 = data.player;
      break;
    case 'event':
      if(data.sfx==='coin')  sfxCoin();
      if(data.sfx==='stomp') sfxStomp();
      if(data.sfx==='jump')  sfxJump();
      break;
    case 'localready':
      // Other player cleared all their coins
      if(mpRole==='host'){
        p2LevelReady = true; // host will check this next frame
      }
      // P2 receiving from host means host is done — P2 just waits for levelchange
      break;
    case 'levelchange':
      // Host advanced level — P2 follows
      if(state){
        const s = initLevel(data.level);
        s.score = data.score;
        s.lives = state.lives;
        state = s;
        p2LevelReady = false;
        updateHUD();
        sfxLevelUp();
        setTimeout(()=>startMusic('normal'),300);
      }
      break;
    case 'boss':
      // Host spawned boss — P2 spawns too
      if(state) spawnBoss();
      break;
    case 'victory':
      showVictory();
      break;
    case 'gameover':
      gameOver();
      break;
    case 'bossupdate':
      // Sync boss HP and rage state from host to P2
      if(state&&state.boss){
        state.boss.hp    = data.hp;
        state.boss.rage  = data.rage;
        state.boss.x     = data.x;
        state.boss.y     = data.y;
        state.boss.flash = data.flash;
        if(data.dead && !state.boss.dead){
          state.boss.dead = true;
          state.boss.deathTimer = 200;
        }
      }
      break;
  }
}

function setHostStatus(msg,color){ const el=document.getElementById('host-status'); if(el){el.textContent=msg;el.style.color=color;} }
function setJoinStatus(msg,color){ const el=document.getElementById('join-status'); if(el){el.textContent=msg;el.style.color=color;} }

function sendMpState() {
  if(!mpReady||!mpConn||!state) return;
  const now = performance.now();
  if(now - lastSendTime < 33) return; // ~30hz
  lastSendTime = now;
  const p = state.player;
  // Always send player position
  mpConn.send({
    type:'state',
    player:{x:p.x,y:p.y,vx:p.vx,vy:p.vy,w:p.w,h:p.h,invincible:p.invincible,trail:[...p.trail]}
  });
  // Host also syncs boss state so P2 sees correct HP/position
  if(mpRole==='host' && state.boss && !state.boss.dead){
    mpConn.send({
      type:'bossupdate',
      hp:state.boss.hp, rage:state.boss.rage,
      x:state.boss.x,  y:state.boss.y,
      flash:state.boss.flash, dead:false
    });
  }
  if(mpRole==='host' && state.boss && state.boss.dead){
    mpConn.send({type:'bossupdate', hp:0, rage:true, x:state.boss.x, y:state.boss.y, flash:0, dead:true});
  }
}

function sendMpEvent(sfx) {
  if(!mpReady||!mpConn) return;
  mpConn.send({type:'event', sfx});
}

let AC = null, masterGain = null, reverbSend = null;
let musicRunning = false, currentTrack = null, musicTimeouts = [];

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = AC.createGain();
  masterGain.gain.value = 0.72;
  masterGain.connect(AC.destination);

  // Simple reverb
  const convolver = AC.createConvolver();
  const len = AC.sampleRate * 2;
  const rb = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = rb.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.2);
  }
  convolver.buffer = rb;
  reverbSend = AC.createGain();
  reverbSend.gain.value = 0.22;
  convolver.connect(reverbSend);
  reverbSend.connect(masterGain);
}

function acNow() { return AC ? AC.currentTime : 0; }

function makeOsc(type, freq, t0, dur, vol, dest, fi=0.012, fo=0.07) {
  if (!AC) return;
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + fi);
  g.gain.setValueAtTime(vol, t0 + dur - fo);
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(g); g.connect(dest);
  o.start(t0); o.stop(t0 + dur + 0.01);
}

function makeSlide(type, f0, f1, t0, dur, vol, dest) {
  if (!AC) return;
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,0.01), t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(g); g.connect(dest);
  o.start(t0); o.stop(t0 + dur + 0.01);
}

function makeNoise(t0, dur, vol, dest, fc=800) {
  if (!AC) return;
  const len = Math.ceil(AC.sampleRate * Math.min(dur + 0.1, 0.6));
  const nb = AC.createBuffer(1, len, AC.sampleRate);
  const d = nb.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(); src.buffer = nb; src.loop = true;
  const filt = AC.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=fc; filt.Q.value=1.5;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(dest);
  src.start(t0); src.stop(t0 + dur + 0.01);
}

// MUSIC
function stopMusic() {
  musicTimeouts.forEach(clearTimeout);
  musicTimeouts = [];
  musicRunning = false;
  currentTrack = null;
}

function startMusic(track) {
  if (currentTrack === track) return;
  stopMusic();
  currentTrack = track;
  musicRunning = true;
  if (track === 'normal') scheduleNormal(acNow() + 0.05, true);
  else if (track === 'boss') scheduleBoss(acNow() + 0.05, true);
}

function scheduleNormal(start, first) {
  if (!musicRunning || currentTrack !== 'normal' || !AC) return;
  const BPM = 128, beat = 60/BPM, bar = beat*4, loop = bar*4;

  const mg = AC.createGain();
  mg.gain.setValueAtTime(first ? 0 : 0.36, start);
  if (first) mg.gain.linearRampToValueAtTime(0.36, start+1.5);
  mg.connect(reverbSend);
  mg.connect(masterGain);

  // Pad chords
  const chords = [[220,277.2,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.6]];
  chords.forEach((ch,ci)=>{
    ch.forEach(freq=>{
      const o=AC.createOscillator(), lfo=AC.createOscillator(), lg=AC.createGain();
      const filt=AC.createBiquadFilter(), g=AC.createGain();
      o.type='sawtooth'; o.frequency.value=freq;
      lfo.type='sine'; lfo.frequency.value=0.35; lg.gain.value=10;
      lfo.connect(lg); lg.connect(o.frequency);
      filt.type='lowpass'; filt.Q.value=3.5;
      filt.frequency.setValueAtTime(350,start+ci*bar);
      filt.frequency.linearRampToValueAtTime(1800,start+ci*bar+bar*0.75);
      const t0=start+ci*bar;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.07,t0+0.18);
      g.gain.setValueAtTime(0.07,t0+bar-0.18); g.gain.linearRampToValueAtTime(0,t0+bar);
      o.connect(filt); filt.connect(g); g.connect(mg);
      o.start(t0); o.stop(t0+bar+0.05);
      lfo.start(t0); lfo.stop(t0+bar+0.05);
    });
  });

  // Arp lead
  const scale=[220,261.6,293.6,329.6,392,440,523.2,659.2,784,880];
  const arp=[0,2,4,5,4,2,0,1,2,4,5,7,5,4,2,0,3,4,6,7,6,4,3,1,1,2,4,5,4,2,1,0];
  const roots=[0,2,4,6];
  arp.forEach((ni,i)=>{
    const barNum=Math.floor(i/8), freq=scale[Math.min(ni+roots[barNum%4],scale.length-1)];
    const t0=start+i*beat*0.5;
    makeSlide('sine',freq,freq*1.002,t0,beat*0.44,0.11,mg);
    makeOsc('triangle',freq*2,t0,beat*0.28,0.035,mg);
  });

  // Bass
  [55,43.6,65.4,49].forEach((f,bi)=>{
    const t0=start+bi*bar;
    makeOsc('square',f,t0,beat*0.32,0.16,mg,0.005,0.05);
    makeOsc('square',f,t0+beat,beat*0.28,0.13,mg,0.005,0.05);
    makeOsc('square',f,t0+beat*2,beat*0.32,0.15,mg,0.005,0.05);
    makeOsc('square',f*1.5,t0+beat*3,beat*0.22,0.09,mg,0.005,0.04);
  });

  // Kick
  for(let b=0;b<16;b++){
    if(b%2===0){ const t0=start+b*beat; makeSlide('sine',160,28,t0,0.17,0.26,mg); makeNoise(t0,0.05,0.07,mg,180); }
  }
  // Snare
  for(let b=0;b<16;b++){
    if(b%4===2){ const t0=start+b*beat; makeNoise(t0,0.09,0.11,mg,2800); makeOsc('triangle',190,t0,0.07,0.09,mg,0.003,0.04); }
  }
  // Hats
  for(let b=0;b<32;b++) makeNoise(start+b*beat*0.5,0.035,0.035,mg,9000);

  const delay=Math.max((start+loop-acNow()-0.6)*1000,50);
  musicTimeouts.push(setTimeout(()=>scheduleNormal(start+loop,false),delay));
}

function scheduleBoss(start, first) {
  if (!musicRunning || currentTrack !== 'boss' || !AC) return;
  const BPM=155, beat=60/BPM, bar=beat*4, loop=bar*4;

  const mg=AC.createGain();
  mg.gain.setValueAtTime(first?0:0.4,start);
  if(first) mg.gain.linearRampToValueAtTime(0.4,start+0.8);
  mg.connect(reverbSend);
  mg.connect(masterGain);

  // Drone bass
  [36.7,73.4,146.8].forEach(f=>{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sawtooth'; o.frequency.value=f;
    g.gain.setValueAtTime(0.055,start); g.gain.setValueAtTime(0.055,start+loop-0.1); g.gain.linearRampToValueAtTime(0,start+loop);
    o.connect(g); g.connect(mg);
    o.start(start); o.stop(start+loop+0.05);
  });

  // Lead riff with tremolo
  const bs=[146.8,164.8,196,220,246.9,293.6,329.6,392,440];
  const riff=[0,2,4,2,0,3,2,0,0,2,4,5,4,2,1,0,0,3,2,0,4,3,2,0,1,0,2,1,3,2,4,3];
  riff.forEach((ni,i)=>{
    const f=bs[Math.min(ni,bs.length-1)]*2;
    const t0=start+i*beat*0.5;
    const o=AC.createOscillator(), lfo=AC.createOscillator(), lg=AC.createGain(), g=AC.createGain();
    o.type='sawtooth'; o.frequency.value=f;
    lfo.type='sine'; lfo.frequency.value=8; lg.gain.value=f*0.35;
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.085,t0+0.012);
    g.gain.linearRampToValueAtTime(0,t0+beat*0.44);
    o.connect(g); g.connect(mg);
    o.start(t0); o.stop(t0+beat*0.5);
    lfo.start(t0); lfo.stop(t0+beat*0.5);
  });

  // Heavy kick every beat
  for(let b=0;b<16;b++){ const t0=start+b*beat; makeSlide('sine',210,22,t0,0.14,0.33,mg); makeNoise(t0,0.04,0.09,mg,140); }
  // Snare
  for(let b=0;b<16;b++){ if(b%4===2){ const t0=start+b*beat; makeNoise(t0,0.1,0.17,mg,2400); makeOsc('square',145,t0,0.08,0.11,mg,0.003,0.04); } }
  // 16th hats
  for(let b=0;b<64;b++) makeNoise(start+b*beat*0.25,0.022,0.045,mg,9500);
  // Stabs
  [0,1.5,2.5,3,5,6,7,7.5].forEach(bt=>{
    const t0=start+bt*beat;
    [146.8,220,293.6].forEach(f=>makeOsc('square',f,t0,0.11,0.065,mg,0.005,0.06));
  });

  const delay=Math.max((start+loop-acNow()-0.6)*1000,50);
  musicTimeouts.push(setTimeout(()=>scheduleBoss(start+loop,false),delay));
}

// INIT LEVEL
// ═══════════════════════════════════════════════════════════════
function getLevelDef(level) { return LEVEL_DEFS[(level-1) % LEVEL_DEFS.length]; }

function initLevel(level, freshStart) {
  const def = getLevelDef(level);
  const mult = 1 + Math.floor((level-1)/LEVEL_DEFS.length)*0.4;

  const platforms = def.platforms.map((p,i)=>({...p,h:p.h||14,color:i===0?'#1a1a3a':'#0d2a4a'}));
  const coins = def.coins.map(c=>({x:c.x,y:c.y,r:6,collected:false,pulse:Math.random()*Math.PI*2}));
  const enemies = def.enemies.map(e=>{
    const en={x:e.x,y:0,w:e.big?22:16,h:e.big?26:18,vx:(Math.random()<0.5?1:-1)*e.speed*mult,minX:e.minX,maxX:e.maxX,dead:false,flash:0,big:!!e.big,sfxPlayed:false,_placed:false};
    platforms.forEach(pl=>{ if(!en._placed&&en.x>=pl.x&&en.x<=pl.x+pl.w){en.y=pl.y-en.h;en._placed=true;} });
    if(!en._placed) en.y=H-20-en.h;
    return en;
  });

  // freshStart=true resets lives & score (used by startGame)
  // otherwise carry over from existing state
  const score = freshStart ? 0 : (state ? state.score : 0);
  const lives = freshStart ? 3 : (state ? state.lives : 3);

  // Spawn 2-3 powerups on random non-ground platforms
  const pwPlats = platforms.filter((_,i)=>i>0);
  const pwCount = 2 + (level > 5 ? 1 : 0);
  const powerups = [];
  for(let i=0;i<pwCount;i++){
    const pl = pwPlats[Math.floor(Math.random()*pwPlats.length)];
    const type = POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
    powerups.push({ x:pl.x+pl.w/2, y:pl.y-18, type, collected:false, pulse:Math.random()*Math.PI*2 });
  }

  return {
    level, name:def.name, glowColor:def.glowColor, bgTint:def.bgTint,
    score, lives,
    platforms, coins, enemies, powerups,
    boss: null, bossPhase: false,
    _localDone: false,
    activePowerups: [], // { typeId, remaining, total }
    player: {x:60,y:H-80,w:18,h:24,vx:0,vy:0,onGround:false,jumpsLeft:2,trail:[],invincible:0,dead:false},
    particles: [],
    tick: 0
  };
}

function spawnBoss() {
  state.bossPhase = true;
  state.boss = {
    x:W/2-55, y:60, w:110, h:90,
    hp:BOSS_MAX_HP, maxHp:BOSS_MAX_HP,
    vx:2.0, floatTick:0, floatBase:50, floatAmp:30, floatSpeed:0.022,
    shootTimer:0, shootInterval:100,
    stompCooldown:0, dead:false, deathTimer:0,
    rage:false, flash:0, projectiles:[],
    deathSfxPlayed:false, lastFlash:0
  };
  document.getElementById('boss-hud').style.display='block';
  updateBossHUD();
  sfxLevelUp();
  setTimeout(()=>startMusic('boss'), 600);
  // Tell P2 to spawn boss too
  if(mpReady&&mpConn) mpConn.send({type:'boss'});
}

function updateBossHUD() {
  const b=state.boss; if(!b)return;
  document.getElementById('boss-fill').style.width=Math.max(0,b.hp/b.maxHp*100)+'%';
  document.getElementById('boss-hp-text').textContent=Math.max(0,b.hp)+'/'+b.maxHp;
}

function updateBoss() {
  const boss=state.boss;
  if(!boss) return;

  if(boss.dead) {
    boss.deathTimer--;
    if(!boss.deathSfxPlayed){ boss.deathSfxPlayed=true; sfxBossDeath(); }
    if(boss.deathTimer<=0) showVictory();
    return;
  }

  boss.floatTick+=boss.floatSpeed;
  boss.y=boss.floatBase+Math.sin(boss.floatTick)*boss.floatAmp;
  boss.x+=boss.vx;
  if(boss.x<=10||boss.x+boss.w>=W-10) boss.vx*=-1;
  if(boss.flash>0) boss.flash--;
  if(boss.stompCooldown>0) boss.stompCooldown--;

  if(!boss.rage&&boss.hp<=boss.maxHp/2) {
    boss.rage=true; boss.shootInterval=55; boss.vx*=1.6;
    spawnParticles(boss.x+boss.w/2,boss.y+boss.h/2,'#f80',22);
  }

  boss.shootTimer++;
  if(boss.shootTimer>=boss.shootInterval) {
    boss.shootTimer=0;
    shootAtPlayer(boss);
    sfxProjectile();
  }

  for(let i=boss.projectiles.length-1;i>=0;i--) {
    const pr=boss.projectiles[i];
    pr.x+=pr.vx; pr.y+=pr.vy;
    if(pr.x<-20||pr.x>W+20||pr.y<-20||pr.y>H+20){boss.projectiles.splice(i,1);continue;}
    const p=state.player;
    if(p.invincible===0){
      const dx=pr.x-(p.x+p.w/2),dy=pr.y-(p.y+p.h/2);
      if(Math.sqrt(dx*dx+dy*dy)<pr.r+9){boss.projectiles.splice(i,1);loseLife();}
    }
  }

  const p=state.player;
  if(boss.stompCooldown===0&&p.invincible===0) {
    const bx={x:boss.x,y:boss.y,w:boss.w,h:boss.h};
    if(collides(p,bx)) {
      if(p.vy>0&&p.y+p.h<boss.y+boss.h*0.38+10) {
        boss.hp--; boss.flash=20; boss.stompCooldown=45;
        p.vy=JUMP_FORCE*0.75; state.score+=50;
        spawnParticles(boss.x+boss.w/2,boss.y,'#fff',16);
        updateHUD(); updateBossHUD();
        sfxBossStomp();
        if(boss.hp<=0){
          boss.dead=true; boss.deathTimer=200; state.score+=500; updateHUD();
          document.getElementById('boss-hud').style.display='none';
          for(let i=0;i<6;i++) setTimeout(()=>{
            if(state&&state.boss) spawnParticles(state.boss.x+Math.random()*state.boss.w,state.boss.y+Math.random()*state.boss.h,['#f33','#f80','#ff0','#fff','#0ff'][Math.floor(Math.random()*5)],18);
          },i*130);
        }
      } else { loseLife(); }
    }
  }
}

function shootAtPlayer(boss) {
  const p=state.player;
  const cx=boss.x+boss.w/2,cy=boss.y+boss.h*0.6;
  const dx=(p.x+p.w/2)-cx,dy=(p.y+p.h/2)-cy;
  const dist=Math.sqrt(dx*dx+dy*dy)||1;
  const spd=boss.rage?5.5:3.8;
  boss.projectiles.push({x:cx,y:cy,vx:dx/dist*spd,vy:dy/dist*spd,r:boss.rage?8:5});
  if(boss.rage){
    const ang=Math.atan2(dy,dx);
    for(const a of [ang-0.38,ang+0.38]) boss.projectiles.push({x:cx,y:cy,vx:Math.cos(a)*spd*0.85,vy:Math.sin(a)*spd*0.85,r:5});
  }
}

// ═══════════════════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════════════════
function spawnParticles(x,y,color,n) {
  for(let i=0;i<n;i++){
    const ang=(Math.PI*2/n)*i+Math.random()*0.5,spd=1.5+Math.random()*3;
    state.particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1,life:1,color});
  }
}

function collides(a,b) { return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

function hasPowerup(id){ return state.activePowerups && state.activePowerups.some(a=>a.typeId===id); }

function activatePowerup(type) {
  // Remove existing of same type and add fresh
  state.activePowerups = state.activePowerups.filter(a=>a.typeId!==type.id);
  state.activePowerups.push({ typeId:type.id, remaining:type.dur, total:type.dur });
  sfxPowerup();
  spawnParticles(state.player.x+9, state.player.y, type.color, 14);
  updatePowerupBar();
}

function tickPowerups() {
  if(!state.activePowerups) return;
  state.activePowerups.forEach(a=>a.remaining--);
  state.activePowerups = state.activePowerups.filter(a=>a.remaining>0);
  updatePowerupBar();
}

function updatePowerupBar() {
  const bar = document.getElementById('powerup-bar');
  if(!bar) return;
  bar.innerHTML = '';
  if(!state.activePowerups) return;
  state.activePowerups.forEach(a=>{
    const def = POWERUP_TYPES.find(t=>t.id===a.typeId);
    if(!def) return;
    const pct = (a.remaining/a.total*100).toFixed(1);
    bar.innerHTML += '<div class="pu-chip" style="color:'+def.color+';border-color:'+def.border+';background:rgba(0,0,0,0.4);">'
      +'<span>'+def.icon+'</span><span>'+def.label+'</span>'
      +'<div class="pu-timer"><div class="pu-timer-fill" style="width:'+pct+'%;background:'+def.color+';"></div></div>'
      +'</div>';
  });
}

function drawPowerups() {
  if(!state.powerups) return;
  state.powerups.forEach(pw=>{
    if(pw.collected) return;
    pw.pulse += 0.07;
    const def = pw.type;
    const bob = Math.sin(pw.pulse)*3;
    const y = pw.y + bob;
    const x = pw.x;

    // Glow ring
    ctx.shadowColor = def.color; ctx.shadowBlur = 16 + Math.sin(pw.pulse)*4;
    ctx.strokeStyle = def.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.stroke();

    // Fill
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI*2); ctx.fill();

    // Icon
    ctx.shadowBlur = 8; ctx.fillStyle = def.color;
    ctx.font = '13px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.icon, x, y);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

    // Label below
    ctx.shadowBlur = 0; ctx.globalAlpha = 0.7;
    ctx.font = '500 0.42rem Orbitron,monospace'; ctx.fillStyle = def.color;
    ctx.textAlign = 'center';
    ctx.fillText(def.label, x, y+20);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  });
}

function updateHUD() {
  document.getElementById('hud-score').textContent=state.score;
  document.getElementById('hud-level').textContent=state.level;
  document.getElementById('hud-lives').textContent=Array(Math.max(0,state.lives)).fill('♦').join(' ')||'—';
}

function update() {
  const p=state.player;
  state.tick++;
  if(p.dead)return;
  if(p.invincible>0)p.invincible--;

  // Jump SFX
  const wantJump=keys['ArrowUp']||keys['KeyW']||keys['Space'];
  if(wantJump&&!keys['_jumpHeld']&&p.jumpsLeft>0){
    if(p.jumpsLeft===2){sfxJump();sendMpEvent('jump');} else sfxDblJump();
  }

  p.vx=0;
  const spd = hasPowerup('speed') ? PLAYER_SPEED*1.75 : PLAYER_SPEED;
  if(keys['ArrowLeft']||keys['KeyA'])p.vx=-spd;
  if(keys['ArrowRight']||keys['KeyD'])p.vx=spd;
  const maxJumps = hasPowerup('triple') ? 3 : 2;
  if(wantJump&&p.jumpsLeft>0&&!keys['_jumpHeld']){
    p.vy=JUMP_FORCE*(p.jumpsLeft===maxJumps?1:0.85);
    p.jumpsLeft--;keys['_jumpHeld']=true;
    spawnParticles(p.x+p.w/2,p.y+p.h,'#0ff',5);
  }
  if(!wantJump)keys['_jumpHeld']=false;

  p.vy=Math.min(p.vy+GRAVITY,18);
  p.x+=p.vx; p.y+=p.vy;
  p.x=Math.max(0,Math.min(W-p.w,p.x));

  p.trail.push({x:p.x+p.w/2,y:p.y+p.h/2,life:1});
  if(p.trail.length>10)p.trail.shift();
  p.trail.forEach(t=>t.life-=0.1);

  p.onGround=false;
  state.platforms.forEach(pl=>{
    if(p.x+p.w>pl.x&&p.x<pl.x+pl.w){
      if(p.vy>=0&&p.y+p.h>pl.y&&p.y+p.h<pl.y+pl.h+14){p.y=pl.y-p.h;p.vy=0;p.onGround=true;p.jumpsLeft=hasPowerup("triple")?3:2;}
      else if(p.vy<0&&p.y<pl.y+pl.h&&p.y>pl.y){p.y=pl.y+pl.h;p.vy=0;}
    }
  });

  if(p.y>H+40){ loseLife(); return; }

  // Coins
  state.coins.forEach(c=>{
    if(!c.collected&&Math.hypot(p.x+p.w/2-c.x,p.y+p.h/2-c.y)<c.r+12){
      c.collected=true;
      const scoreGain = hasPowerup('multi') ? 20 : 10;
      state.score+=scoreGain;
      spawnParticles(c.x,c.y,'#ff0',6); updateHUD(); sfxCoin(); sendMpEvent('coin');
    }
    c.pulse+=0.08;
  });

  // Powerup collection
  if(state.powerups) {
    const magnet = hasPowerup('magnet');
    state.powerups.forEach(pw=>{
      if(pw.collected) return;
      const dist = Math.hypot(p.x+p.w/2-pw.x, p.y+p.h/2-pw.y);
      // Magnet pulls coins — pull powerups too if close
      if(magnet && dist < 80) {
        const dx=p.x+p.w/2-pw.x, dy=p.y+p.h/2-pw.y, d=Math.sqrt(dx*dx+dy*dy)||1;
        pw.x += dx/d*3; pw.y += dy/d*3;
      }
      if(dist < 18) {
        pw.collected = true;
        activatePowerup(pw.type);
      }
    });
  }

  // Magnet pulls uncollected coins
  if(hasPowerup('magnet')) {
    state.coins.forEach(co=>{
      if(co.collected) return;
      const dx=p.x+p.w/2-co.x, dy=p.y+p.h/2-co.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      if(d<120){ co.x+=dx/d*4; co.y+=dy/d*4; }
    });
  }

  tickPowerups();

  // Enemies
  if(!state.bossPhase){
    state.enemies.forEach(en=>{
      if(en.dead)return;
      const shrinkMult = hasPowerup('shrink') ? 0.3 : 1;
      en.x+=en.vx*shrinkMult;
      if(en.x<=en.minX||en.x+en.w>=en.maxX)en.vx*=-1;
      if(en.flash>0)en.flash--;
      if(p.invincible===0&&collides(p,en)){
        if(p.vy>0&&p.y+p.h<en.y+en.h/2+8){
          en.dead=true; p.vy=JUMP_FORCE*0.7; state.score+=25;
          spawnParticles(en.x+en.w/2,en.y,'#f0f',10); updateHUD(); sfxStomp(); sendMpEvent('stomp');
        } else {
          if(hasPowerup('shield')){ p.vy=JUMP_FORCE*0.5; p.invincible=60; spawnParticles(p.x+9,p.y,'#0ff',10); }
          else loseLife();
        }
      }
    });
  }

  state.particles.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.1;pt.life-=0.04;});
  state.particles=state.particles.filter(pt=>pt.life>0);

  const allCoins = state.coins.length>0 && state.coins.every(co=>co.collected);

  if(state.level===10){
    if(allCoins && !state.bossPhase){
      if(gameMode===1){
        spawnBoss();
      } else if(mpRole==='host'){
        // In 2P: both must clear coins before boss spawns
        if(!state._localDone){ state._localDone=true; if(mpReady&&mpConn) mpConn.send({type:'localready'}); }
        if(state._localDone && p2LevelReady){ p2LevelReady=false; state._localDone=false; spawnBoss(); }
      }
      // P2: just wait — host will send 'boss' when both ready
    }
    if(state.bossPhase) updateBoss();
  } else {
    if(allCoins){
      if(gameMode===1){
        // Solo: advance immediately
        state.score+=100*state.level; sfxLevelUp();
        const nxt=state.level+1;
        state=initLevel(nxt); updateHUD();
        setTimeout(()=>startMusic('normal'),300);
      } else if(mpRole==='host'){
        // 2P host: wait for BOTH players to clear coins
        if(!state._localDone){ state._localDone=true; if(mpReady&&mpConn) mpConn.send({type:'localready'}); }
        if(state._localDone && p2LevelReady){
          p2LevelReady=false; state._localDone=false;
          state.score+=100*state.level; sfxLevelUp();
          const nxt=state.level+1;
          state=initLevel(nxt); updateHUD();
          setTimeout(()=>startMusic('normal'),300);
          if(mpReady&&mpConn) mpConn.send({type:'levelchange', level:nxt, score:state.score});
        }
      }
      // P2 in 2P: just signal host and wait for 'levelchange'
      else if(mpRole==='join'){
        if(!state._localDone){ state._localDone=true; if(mpReady&&mpConn) mpConn.send({type:'localready'}); }
      }
    }
  }
}

function loseLife() {
  if(!state || !animId) return; // already game over
  sfxHit();
  const p=state.player;
  spawnParticles(p.x+p.w/2,p.y+p.h/2,'#ff3e6c',16);
  state.lives--; updateHUD();
  if(state.lives<=0){ gameOver(); return; }
  p.x=60;p.y=H-80;p.vx=0;p.vy=0;p.invincible=120;p.trail=[];
}

function showOverlay(html) {
  const ov = document.getElementById('overlay');
  ov.innerHTML = html;
  ov.style.cssText = 'display:flex;flex-direction:column;align-items:center;justify-content:center;position:absolute;inset:0;background:rgba(5,5,15,0.88);backdrop-filter:blur(4px);';
}

function gameOver() {
  if(mpReady&&mpConn) mpConn.send({type:'gameover'});
  cancelAnimationFrame(animId); animId=null; stopMusic(); sfxHit();
  document.getElementById('boss-hud').style.display='none';
  document.getElementById('powerup-bar').innerHTML='';
  const score=state?state.score:0, level=state?state.level:1;
  showOverlay(`
    <h1 style="color:#ff3e6c;text-shadow:0 0 20px #ff3e6c;">GAME OVER</h1>
    <div style="font-family:'Orbitron',monospace;font-size:1rem;color:#ff3e6c;margin-bottom:1rem;letter-spacing:0.1em;">SCORE: ${score}</div>
    <div class="tagline" style="margin-bottom:2rem;">LEVEL ${level} REACHED</div>
    <button class="start-btn" onclick="startGame()" style="border-color:#ff3e6c;color:#ff3e6c;">TRY AGAIN</button>
  `);
}

function showVictory() {
  if(mpReady&&mpConn) mpConn.send({type:'victory'});
  cancelAnimationFrame(animId); animId=null; stopMusic(); sfxVictory();
  document.getElementById('boss-hud').style.display='none';
  document.getElementById('powerup-bar').innerHTML='';
  const score=state?state.score:0;
  showOverlay(`
    <h1 style="color:#ffd700;text-shadow:0 0 20px #ffd700;font-size:2.4rem;">YOU WIN!</h1>
    <div class="tagline" style="color:rgba(255,215,0,0.7);margin-bottom:0.75rem;">THE OVERLORD IS DEFEATED</div>
    <div style="font-family:'Orbitron',monospace;font-size:1.1rem;color:#fff;margin-bottom:2.5rem;letter-spacing:0.1em;">FINAL SCORE: ${score}</div>
    <button class="start-btn" onclick="startGame()" style="border-color:#ffd700;color:#ffd700;">PLAY AGAIN</button>
  `);
}

function startGame() {
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  document.getElementById('overlay').style.display='none';
  document.getElementById('boss-hud').style.display='none';
  // Show P2 HUD if multiplayer
  if(gameMode===2){
    document.getElementById('p2-hud-item').style.display='';
    document.getElementById('hud-p2-status').textContent = mpRole==='host'?'P2 ✓':'P1 ✓';
  }
  keys={};
  if(animId){ cancelAnimationFrame(animId); animId=null; }
  state=null;
  state=initLevel(1, true);
  updateHUD();
  showDpad();
  startMusic('normal');
  loop();
}

// ═══════════════════════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════════════════════
function hexToRgb(h){return `${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`;}

function drawBg() {
  ctx.fillStyle=state.bgTint||'#05050f';
  ctx.fillRect(0,0,W,H);
  const gc=state.glowColor||'#0ff';
  ctx.strokeStyle=`rgba(${hexToRgb(gc)},0.06)`;
  ctx.lineWidth=1;
  const gOff=(state.tick*0.3)%40;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=gOff;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  bgStars.forEach(s=>{
    s.x-=s.speed; if(s.x<0){s.x=W;s.y=Math.random()*H;}
    ctx.globalAlpha=s.alpha*(0.5+0.5*Math.sin(state.tick*0.02+s.x));
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawPlatform(pl) {
  const glow=state.glowColor||'#0af';
  ctx.fillStyle=pl.color||'#0d2a4a'; ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
  ctx.strokeStyle=glow; ctx.lineWidth=1.5; ctx.shadowColor=glow; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.moveTo(pl.x,pl.y); ctx.lineTo(pl.x+pl.w,pl.y); ctx.stroke();
  ctx.shadowBlur=0;
}

function drawCoin(c) {
  if(c.collected)return;
  const pulse=Math.sin(c.pulse)*2;
  ctx.shadowColor='#ff0'; ctx.shadowBlur=10+pulse*2;
  ctx.strokeStyle='#ff0'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(c.x,c.y,c.r+pulse*0.3,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,220,0,0.3)'; ctx.fill();
  ctx.fillStyle='#ffd700';
  ctx.beginPath(); ctx.moveTo(c.x,c.y-4); ctx.lineTo(c.x+3,c.y); ctx.lineTo(c.x,c.y+4); ctx.lineTo(c.x-3,c.y); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
}

function drawEnemy(en) {
  if(en.dead)return;
  const flicker=en.flash>0&&Math.sin(en.flash*0.5)>0;
  ctx.shadowColor=en.big?'#f40':'#f0f'; ctx.shadowBlur=flicker?24:(en.big?16:10);
  ctx.fillStyle=flicker?'#fff':(en.big?'#ff2200':'#cc00cc');
  ctx.beginPath(); ctx.moveTo(en.x+en.w/2,en.y); ctx.lineTo(en.x+en.w,en.y+en.h); ctx.lineTo(en.x,en.y+en.h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=en.big?'#f40':'#f0f'; ctx.lineWidth=en.big?2:1; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(en.x+en.w/2,en.y+en.h*0.55,en.big?3.5:2.5,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
}

function drawBoss() {
  const boss=state.boss; if(!boss)return;
  const cx=boss.x+boss.w/2, t=state.tick;
  const flicker=boss.flash>0&&Math.floor(boss.flash/4)%2===0;

  if(boss.dead){
    const prog=1-boss.deathTimer/200;
    ctx.globalAlpha=Math.max(0,1-prog*2);
    ctx.shadowColor='#f80'; ctx.shadowBlur=40; ctx.fillStyle='#ff4400';
    ctx.beginPath(); ctx.arc(cx,boss.y+boss.h/2,boss.w/2*(1-prog),0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1; ctx.shadowBlur=0; return;
  }

  const pulse=Math.sin(t*0.05)*6;
  const glowCol=boss.rage?'#f80':'#f0a';
  ctx.shadowColor=glowCol; ctx.shadowBlur=30+pulse;
  ctx.fillStyle=flicker?'#fff':(boss.rage?'#ff2200':'#cc0044');
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const ang=(Math.PI*2/6)*i-Math.PI/2;
    const px=cx+Math.cos(ang)*(boss.w/2+pulse*0.4), py=boss.y+boss.h/2+Math.sin(ang)*(boss.h/2+pulse*0.2);
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=flicker?'#ff0':glowCol; ctx.lineWidth=3; ctx.stroke();

  ctx.fillStyle=flicker?'#ff0':(boss.rage?'#ff6600':'#ff0088');
  ctx.shadowBlur=15; ctx.beginPath(); ctx.arc(cx,boss.y+boss.h/2,(boss.w/2+pulse*0.4)*0.45,0,Math.PI*2); ctx.fill();

  ctx.shadowColor='#fff'; ctx.shadowBlur=12; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(cx-14,boss.y+boss.h/2-6,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+14,boss.y+boss.h/2-6,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=boss.rage?'#f00':'#300';
  ctx.beginPath(); ctx.arc(cx-14,boss.y+boss.h/2-6,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+14,boss.y+boss.h/2-6,2.5,0,Math.PI*2); ctx.fill();

  const shards=boss.rage?6:4;
  for(let i=0;i<shards;i++){
    const ang=(Math.PI*2/shards)*i+t*0.04*(boss.rage?2:1);
    const r=(boss.w/2+pulse*0.4)+20+Math.sin(t*0.06+i)*5;
    const sx=cx+Math.cos(ang)*r, sy=boss.y+boss.h/2+Math.sin(ang)*r*0.5;
    ctx.fillStyle=boss.rage?'#f80':'#f0a'; ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(sx,sy,4,0,Math.PI*2); ctx.fill();
  }

  // HP pips
  ctx.shadowBlur=0;
  const pw=10,pg=4,tot=boss.maxHp*(pw+pg)-pg,px0=cx-tot/2,py=boss.y+boss.h+14;
  for(let i=0;i<boss.maxHp;i++){
    const f=i<boss.hp;
    ctx.fillStyle=f?(boss.rage?'#f80':'#f0a'):'rgba(255,255,255,0.12)';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=f?6:0;
    ctx.fillRect(px0+i*(pw+pg),py,pw,4);
  }
  ctx.shadowBlur=0;

  if(boss.rage&&Math.floor(t/30)%2===0&&boss.hp>0){
    ctx.globalAlpha=0.7; ctx.font='700 0.55rem Orbitron,monospace';
    ctx.fillStyle='#f80'; ctx.textAlign='center';
    ctx.fillText('RAGE MODE',cx,boss.y-10);
    ctx.textAlign='left'; ctx.globalAlpha=1;
  }

  // Projectiles
  boss.projectiles.forEach(pr=>{
    ctx.shadowColor=boss.rage?'#f80':'#f0a'; ctx.shadowBlur=14;
    ctx.fillStyle=boss.rage?'#ff6600':'#ff00aa';
    ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1; ctx.stroke();
    ctx.shadowBlur=0;
  });
}

function drawPlayer(p) {
  p.trail.forEach((t,i)=>{ctx.globalAlpha=t.life*0.35*(i/p.trail.length);ctx.fillStyle='#0ff';ctx.fillRect(t.x-4,t.y-6,8,12);});
  ctx.globalAlpha=1;
  if(p.invincible>0&&Math.floor(p.invincible/6)%2===0)return;
  const puGlow = hasPowerup('shield')?'#0ff': hasPowerup('speed')?'#ff0': hasPowerup('triple')?'#f0f': hasPowerup('multi')?'#ffa': hasPowerup('magnet')?'#f8a':'#0ff';
  ctx.shadowColor=puGlow; ctx.shadowBlur=18+(hasPowerup('shield')?10:0);
  ctx.fillStyle=puGlow; ctx.fillRect(p.x+3,p.y+8,p.w-6,p.h-8);
  ctx.fillStyle='#0df'; ctx.fillRect(p.x+2,p.y,p.w-4,10);
  ctx.fillStyle='#001a2e'; ctx.fillRect(p.x+4,p.y+2,p.w-8,5);
  ctx.fillStyle='#009aa8';
  if(keys['ArrowLeft']||keys['KeyA']||keys['ArrowRight']||keys['KeyD']){
    const la=Math.sin(state.tick*0.3)*3;
    ctx.fillRect(p.x+2,p.y+p.h-5,5,5+la); ctx.fillRect(p.x+p.w-7,p.y+p.h-5,5,5-la);
  } else { ctx.fillRect(p.x+2,p.y+p.h-5,5,5); ctx.fillRect(p.x+p.w-7,p.y+p.h-5,5,5); }
  ctx.shadowBlur=0;
}

function drawParticles() {
  state.particles.forEach(pt=>{
    ctx.globalAlpha=pt.life; ctx.fillStyle=pt.color; ctx.shadowColor=pt.color; ctx.shadowBlur=6;
    ctx.fillRect(pt.x-2,pt.y-2,4,4);
  });
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

function drawLevelBanner() {
  // 2P waiting banner — show when this player cleared coins but waiting on partner
  if(gameMode===2 && state._localDone && !state.bossPhase && state.coins.every(co=>co.collected)){
    const gc = state.glowColor||'#0ff';
    ctx.globalAlpha = 0.85;
    ctx.textAlign='center';
    ctx.font='900 0.9rem Orbitron,monospace';
    ctx.fillStyle=gc; ctx.shadowColor=gc; ctx.shadowBlur=14;
    ctx.fillText('WAITING FOR OTHER PLAYER…', W/2, 30);
    ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign='left';
  }
  if(state.tick>=90)return;
  const a=state.tick<60?1:1-(state.tick-60)/30, gc=state.glowColor||'#0ff';
  ctx.globalAlpha=a; ctx.textAlign='center';
  ctx.shadowColor=gc; ctx.shadowBlur=20; ctx.font='900 1.4rem Orbitron,monospace'; ctx.fillStyle=gc;
  ctx.fillText(`LEVEL ${state.level}  —  ${state.name}`,W/2,H/2-10);
  ctx.shadowBlur=0; ctx.font='700 0.72rem Orbitron,monospace'; ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.fillText(state.level===10?'COLLECT ORBS — THEN DEFEAT THE OVERLORD':'COLLECT ALL ORBS TO ADVANCE',W/2,H/2+18);
  ctx.globalAlpha=1; ctx.textAlign='left';
}

function drawP2() {
  if(!p2 || gameMode!==2) return;
  // Draw remote player in magenta
  p2.trail = p2.trail || [];
  p2.trail.forEach((t,i)=>{
    ctx.globalAlpha=t.life*0.35*(i/Math.max(p2.trail.length,1));
    ctx.fillStyle='#f0f';
    ctx.fillRect(t.x-4,t.y-6,8,12);
  });
  ctx.globalAlpha=1;
  if(p2.invincible>0&&Math.floor(p2.invincible/6)%2===0) return;
  ctx.shadowColor='#f0f'; ctx.shadowBlur=18;
  ctx.fillStyle='#f0f'; ctx.fillRect(p2.x+3,p2.y+8,p2.w-6,p2.h-8);
  ctx.fillStyle='#c0c'; ctx.fillRect(p2.x+2,p2.y,p2.w-4,10);
  ctx.fillStyle='#1a001a'; ctx.fillRect(p2.x+4,p2.y+2,p2.w-8,5);
  ctx.fillStyle='#880088';
  ctx.fillRect(p2.x+2,p2.y+p2.h-5,5,5);
  ctx.fillRect(p2.x+p2.w-7,p2.y+p2.h-5,5,5);
  // P2 label
  ctx.shadowBlur=0; ctx.globalAlpha=0.7;
  ctx.font='700 0.5rem Orbitron,monospace'; ctx.fillStyle='#f0f'; ctx.textAlign='center';
  ctx.fillText('P2',p2.x+p2.w/2,p2.y-4);
  ctx.textAlign='left'; ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

function draw() {
  drawBg();
  state.platforms.forEach(drawPlatform);
  state.coins.forEach(drawCoin);
  if(!state.bossPhase)state.enemies.forEach(drawEnemy);
  drawBoss();
  drawPowerups();
  drawP2();
  drawPlayer(state.player);
  drawParticles();
  drawLevelBanner();
}

function loop() {
  if(!state)return;
  update();
  sendMpState();
  draw();
  animId=requestAnimationFrame(loop);
}

window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

// ── D-PAD ──────────────────────────────────────────────────────
const dpadMap = { left:'ArrowLeft', right:'ArrowRight', jump:'ArrowUp' };
function dpadDown(dir) {
  keys[dpadMap[dir]] = true;
  document.getElementById('btn-'+dir).classList.add('pressed');
}
function dpadUp(dir) {
  keys[dpadMap[dir]] = false;
  // also clear jump-held so repeated taps work
  if(dir==='jump') keys['_jumpHeld'] = false;
  document.getElementById('btn-'+dir).classList.remove('pressed');
}
// Prevent ghost touches
document.querySelectorAll('.dpad-btn').forEach(btn=>{
  btn.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  btn.addEventListener('touchend',  e=>e.preventDefault(),{passive:false});
  btn.addEventListener('contextmenu',e=>e.preventDefault());
});

// ── SCALING ────────────────────────────────────────────────────
const GAME_W = 800, GAME_H = 440; // native canvas + hud area
function scaleGame() {
  const wrap = document.getElementById('scale-wrap');
  const hudH = document.getElementById('hud').offsetHeight +
               (document.getElementById('boss-hud').offsetHeight || 0);
  const totalH = GAME_H + hudH + 4; // 4px gap
  const scaleX = window.innerWidth  / GAME_W;
  const scaleY = window.innerHeight / totalH;
  const scale  = Math.min(scaleX, scaleY, 1); // never upscale beyond native
  wrap.style.transform = `scale(${scale})`;
  // Also scale dpad position inside canvas-wrap
  const canvasWrap = document.getElementById('canvas-wrap');
  canvasWrap.style.position = 'relative';
}
window.addEventListener('resize', scaleGame);
window.addEventListener('orientationchange', ()=>setTimeout(scaleGame,150));
scaleGame();

// ── PORTRAIT WARNING ───────────────────────────────────────────
function checkOrientation() {
  const isPortrait = window.innerHeight > window.innerWidth;
  const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  document.getElementById('portrait-msg').classList.toggle('show', isMobile && isPortrait);
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', ()=>setTimeout(checkOrientation,150));
checkOrientation();

// ── SHOW DPAD ON TOUCH DEVICES ─────────────────────────────────
function showDpad() {
  const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if(isMobile) document.getElementById('dpad').classList.add('visible');
}

// ─── CHEAT CODE ──────────────────────────────────────────────
let ctrl3Held = false;

function openCheat() {
  // Only works if a game is running or on start screen
  const grid = document.getElementById('cheat-grid');
  grid.innerHTML = '';
  const currentLvl = state ? state.level : 0;
  for(let i = 1; i <= 10; i++){
    const def = LEVEL_DEFS[i-1];
    const btn = document.createElement('button');
    btn.className = 'cheat-lvl-btn' + (i===currentLvl?' current':'');
    btn.innerHTML = i + '<br><span style="font-size:0.45rem;opacity:0.6;letter-spacing:0.05em;">' + (def?def.name.split(' ')[0]:'???') + '</span>';
    btn.onclick = () => warpToLevel(i);
    grid.appendChild(btn);
  }
  document.getElementById('cheat-modal').classList.add('open');
}

function closeCheat() {
  document.getElementById('cheat-modal').classList.remove('open');
}

function warpToLevel(lvl) {
  closeCheat();
  // If game isn't running, start it first
  if(!state || !animId){
    initAudio();
    if(AC&&AC.state==='suspended') AC.resume();
    document.getElementById('overlay').style.display='none';
    document.getElementById('boss-hud').style.display='none';
    if(animId){ cancelAnimationFrame(animId); animId=null; }
  }
  // Preserve score and lives, warp level
  const prevScore = state ? state.score : 0;
  const prevLives = state ? state.lives : 3;
  p2LevelReady = false;
  state = initLevel(lvl, false);
  state.score = prevScore;
  state.lives = prevLives;
  updateHUD();
  stopMusic();
  if(lvl===10 && state.bossPhase) setTimeout(()=>startMusic('boss'),300);
  else setTimeout(()=>startMusic('normal'),300);
  showDpad();
  if(!animId) loop();
  // Notify P2 in multiplayer
  if(mpReady&&mpConn) mpConn.send({type:'levelchange', level:lvl, score:prevScore});
}

window.addEventListener('keydown', e => {
  if(e.key==='3' && (e.ctrlKey||e.metaKey)){
    e.preventDefault();
    openCheat();
  }
  // Close on Escape
  if(e.key==='Escape') closeCheat();
});

initStars();
selectMode(1); // default to 1 player
</script>
