<body>

<div id="hud">

      {x:70, y:135},{x:210,y:120},{x:360,y:130},{x:500,y:120},{x:650,y:135},{x:750,y:125},
      {x:360,y:60},{x:400,y:60},{x:440,y:60},
    ],
    enemies: [
      {x:65, minX:60, maxX:150, speed:2.2,big:true},
      {x:405,minX:400,maxX:490, speed:2.4,big:true},
      {x:585,minX:580,maxX:670, speed:2.2,big:true},
      {x:165,minX:160,maxX:240, speed:3.0},
      {x:315,minX:310,maxX:380, speed:3.2},
      {x:455,minX:450,maxX:520, speed:3.4},
      {x:695,minX:690,maxX:760, speed:3.0},
      {x:85, minX:80, maxX:150, speed:3.5},
      {x:225,minX:220,maxX:290, speed:3.8},
      {x:465,minX:460,maxX:530, speed:4.0},
      {x:645,minX:640,maxX:710, speed:3.5},
      {x:305,minX:300,maxX:490, speed:2.0},
    ]
  },
];

function getLevelDef(level) {
  // Levels 1-10 are hand-crafted; beyond 10 we cycle back with higher difficulty
  const idx = (level - 1) % LEVEL_DEFS.length;
  return LEVEL_DEFS[idx];
}

function makePlatforms(level) {
  const def = getLevelDef(level);
  return def.platforms.map((p, i) => ({
    ...p,
    h: p.h || 14,
    color: i === 0 ? '#1a1a3a' : '#0d2a4a',
    glow: def.glowColor
  }));
}

function makeCoins(level) {
  const def = getLevelDef(level);
  return def.coins.map(c => ({
    x: c.x, y: c.y, r: 6, collected: false,
    pulse: Math.random() * Math.PI * 2
  }));
}

function makeEnemies(level) {
  const def = getLevelDef(level);
  const speedMult = 1 + Math.floor((level - 1) / LEVEL_DEFS.length) * 0.4;
  return def.enemies.map(e => ({
    x: e.x, y: 0, // y set by platform in initLevel
    w: e.big ? 22 : 16,
    h: e.big ? 26 : 18,
    vx: (Math.random() < 0.5 ? 1 : -1) * e.speed * speedMult,
    minX: e.minX, maxX: e.maxX,
    dead: false, flash: 0, big: !!e.big
  }));
}

function initLevel(level) {
  const def = getLevelDef(level);
  const platforms = makePlatforms(level);
  const coins = makeCoins(level);
  const enemies = makeEnemies(level);

  // Anchor enemy y to just above ground (420 - enemy.h) — they walk on their own platforms
  // Actually they float at a fixed y matching their platform; use minX to infer platform y
  platforms.forEach(pl => {
    enemies.forEach(en => {
      if (en.x >= pl.x && en.x <= pl.x + pl.w && !en._placed) {
        en.y = pl.y - en.h;
        en._placed = true;
      }
    });
  });
  // Fallback for any unplaced
  enemies.forEach(en => { if (!en._placed) en.y = H - 20 - en.h; });

  return {
    level,
    name: def.name,
    glowColor: def.glowColor,
    bgTint: def.bgTint,
    score: state ? state.score : 0,
    lives: state ? state.lives : 3,
    platforms,
    coins,
    enemies,
    player: {
      x: 60, y: H - 80, w: 18, h: 24,
      vx: 0, vy: 0,
      onGround: false, jumpsLeft: 2,
      trail: [], invincible: 0, dead: false
    },
    particles: [],
    cameraX: 0,
    tick: 0
  };
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  keys = {};
  state = null;
  state = initLevel(1);
  updateHUD();
  if (animId) cancelAnimationFrame(animId);
  loop();
}

function updateHUD() {
  document.getElementById('hud-score').textContent = state.score;
  document.getElementById('hud-level').textContent = state.level;
  const livesStr = Array(state.lives).fill('♦').join(' ');
  document.getElementById('hud-lives').textContent = livesStr || '—';
}

// Input
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function spawnParticles(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i + Math.random() * 0.5;
    const speed = 1.5 + Math.random() * 3;
    state.particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1, life: 1, color });
  }
}

function collides(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  const p = state.player;
  state.tick++;

  if (p.dead) return;
  if (p.invincible > 0) p.invincible--;

  // Movement
  p.vx = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) p.vx = -PLAYER_SPEED;
  if (keys['ArrowRight'] || keys['KeyD']) p.vx = PLAYER_SPEED;
  if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && p.jumpsLeft > 0) {
    if (!keys['_jumpHeld']) {
      p.vy = JUMP_FORCE * (p.jumpsLeft === 2 ? 1 : 0.85);
      p.jumpsLeft--;
      keys['_jumpHeld'] = true;
      spawnParticles(p.x + p.w / 2, p.y + p.h, '#0ff', 5);
    }
  } else {
    keys['_jumpHeld'] = false;
  }

  p.vy += GRAVITY;
  p.vy = Math.min(p.vy, 18);
  p.x += p.vx;
  p.y += p.vy;

  // Trail
  p.trail.push({ x: p.x + p.w / 2, y: p.y + p.h / 2, life: 1 });
  if (p.trail.length > 10) p.trail.shift();
  p.trail.forEach(t => t.life -= 0.1);

  // Wall bounds
  p.x = Math.max(0, Math.min(W - p.w, p.x));

  // Platform collision
  p.onGround = false;
  state.platforms.forEach(pl => {
    if (p.x + p.w > pl.x && p.x < pl.x + pl.w) {
      if (p.y + p.h > pl.y && p.y + p.h < pl.y + pl.h + 14 && p.vy >= 0) {
        p.y = pl.y - p.h;
        p.vy = 0;
        p.onGround = true;
        p.jumpsLeft = 2;
      } else if (p.y < pl.y + pl.h && p.y > pl.y && p.vy < 0) {
        p.y = pl.y + pl.h;
        p.vy = 0;
      }
    }
  });

  // Fall death
  if (p.y > H + 40) {
    loseLife();
    return;
  }

  // Coins
  state.coins.forEach(c => {
    if (!c.collected && Math.hypot(p.x + p.w/2 - c.x, p.y + p.h/2 - c.y) < c.r + 12) {
      c.collected = true;
      state.score += 10;
      spawnParticles(c.x, c.y, '#ff0', 6);
      updateHUD();
    }
    c.pulse += 0.08;
  });

  // Enemies
  state.enemies.forEach(en => {
    if (en.dead) return;
    en.x += en.vx;
    if (en.x <= en.minX || en.x + en.w >= en.maxX) en.vx *= -1;
    if (en.flash > 0) en.flash--;

    if (p.invincible === 0 && collides(p, en)) {
      // Stomp from above?
      if (p.vy > 0 && p.y + p.h < en.y + en.h / 2 + 8) {
        en.dead = true;
        p.vy = JUMP_FORCE * 0.7;
        state.score += 25;
        spawnParticles(en.x + en.w/2, en.y, '#f0f', 10);
        updateHUD();
      } else {
        loseLife();
      }
    }
  });

  // Particles
  state.particles.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.1; pt.life -= 0.04; });
  state.particles = state.particles.filter(pt => pt.life > 0);

  // Level complete
  if (state.coins.length > 0 && state.coins.every(c => c.collected)) {
    state.score += 100 * state.level;
    const nextLevel = state.level + 1;
    state = initLevel(nextLevel);
    updateHUD();
  }
}

function loseLife() {
  const p = state.player;
  spawnParticles(p.x + p.w/2, p.y + p.h/2, '#ff3e6c', 16);
  state.lives--;
  updateHUD();
  if (state.lives <= 0) {
    gameOver();
  } else {
    p.x = 60; p.y = H - 80; p.vx = 0; p.vy = 0; p.invincible = 120; p.trail = [];
  }
}

function gameOver() {
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1 style="color:#ff3e6c;text-shadow:0 0 20px #ff3e6c,0 0 60px rgba(255,62,108,0.4);">GAME OVER</h1>
    <div id="gameover-score">SCORE: ${state.score}</div>
    <div class="tagline" style="margin-bottom:2rem;">LEVEL ${state.level} REACHED</div>
    <button id="start-btn" onclick="startGame()" style="border-color:#ff3e6c;color:#ff3e6c;box-shadow:0 0 12px rgba(255,62,108,0.3);">TRY AGAIN</button>
  `;
  ov.style.display = 'flex';
  ov.style.flexDirection = 'column';
  ov.style.alignItems = 'center';
  ov.style.justifyContent = 'center';
}

// ---- DRAW ----
function drawBg() {
  ctx.fillStyle = state.bgTint || '#05050f';
  ctx.fillRect(0, 0, W, H);

  const gc = state.glowColor || '#0ff';
  ctx.strokeStyle = `rgba(${hexToRgb(gc)},0.06)`;
  ctx.lineWidth = 1;
  const gOff = (state.tick * 0.3) % 40;
  for (let x = -40; x < W + 40; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = gOff; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  bgStars.forEach(s => {
    s.x -= s.speed;
    if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    ctx.globalAlpha = s.alpha * (0.5 + 0.5 * Math.sin(state.tick * 0.02 + s.x));
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function drawPlatform(pl) {
  const glow = state.glowColor || '#0af';
  ctx.fillStyle = pl.color || '#0d2a4a';
  ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
  ctx.strokeStyle = glow;
  ctx.lineWidth = 1.5;
  ctx.shadowColor = glow;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(pl.x, pl.y);
  ctx.lineTo(pl.x + pl.w, pl.y);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawCoin(c) {
  if (c.collected) return;
  const pulse = Math.sin(c.pulse) * 2;
  ctx.shadowColor = '#ff0';
  ctx.shadowBlur = 10 + pulse * 2;
  ctx.strokeStyle = '#ff0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.r + pulse * 0.3, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,220,0,0.3)';
  ctx.fill();
  // Inner diamond
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.moveTo(c.x, c.y - 4);
  ctx.lineTo(c.x + 3, c.y);
  ctx.lineTo(c.x, c.y + 4);
  ctx.lineTo(c.x - 3, c.y);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawEnemy(en) {
  if (en.dead) return;
  const flicker = en.flash > 0 ? Math.sin(en.flash * 0.5) > 0 : false;
  const col = en.big ? '#ff2200' : '#cc00cc';
  const glow = en.big ? '#f40' : '#f0f';
  ctx.shadowColor = glow;
  ctx.shadowBlur = flicker ? 24 : (en.big ? 16 : 10);
  ctx.fillStyle = flicker ? '#fff' : col;
  ctx.beginPath();
  ctx.moveTo(en.x + en.w / 2, en.y);
  ctx.lineTo(en.x + en.w, en.y + en.h);
  ctx.lineTo(en.x, en.y + en.h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = glow;
  ctx.lineWidth = en.big ? 2 : 1;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(en.x + en.w / 2, en.y + en.h * 0.55, en.big ? 3.5 : 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawPlayer(p) {
  // Trail
  p.trail.forEach((t, i) => {
    const a = t.life * 0.35 * (i / p.trail.length);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#0ff';
    ctx.fillRect(t.x - 4, t.y - 6, 8, 12);
  });
  ctx.globalAlpha = 1;

  // Invincibility flicker
  if (p.invincible > 0 && Math.floor(p.invincible / 6) % 2 === 0) return;

  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 18;

  // Body
  ctx.fillStyle = '#0ff';
  ctx.fillRect(p.x + 3, p.y + 8, p.w - 6, p.h - 8);

  // Head
  ctx.fillStyle = '#0df';
  ctx.fillRect(p.x + 2, p.y, p.w - 4, 10);

  // Visor
  ctx.fillStyle = '#001a2e';
  ctx.fillRect(p.x + 4, p.y + 2, p.w - 8, 5);

  // Legs
  ctx.fillStyle = '#009aa8';
  if (keys['ArrowLeft'] || keys['KeyA'] || keys['ArrowRight'] || keys['KeyD']) {
    const legAnim = Math.sin(state.tick * 0.3) * 3;
    ctx.fillRect(p.x + 2, p.y + p.h - 5, 5, 5 + legAnim);
    ctx.fillRect(p.x + p.w - 7, p.y + p.h - 5, 5, 5 - legAnim);
  } else {
    ctx.fillRect(p.x + 2, p.y + p.h - 5, 5, 5);
    ctx.fillRect(p.x + p.w - 7, p.y + p.h - 5, 5, 5);
  }
  ctx.shadowBlur = 0;
}

function drawParticles() {
  state.particles.forEach(pt => {
    ctx.globalAlpha = pt.life;
    ctx.fillStyle = pt.color;
    ctx.shadowColor = pt.color;
    ctx.shadowBlur = 6;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function draw() {
  drawBg();
  state.platforms.forEach(drawPlatform);
  state.coins.forEach(drawCoin);
  state.enemies.forEach(drawEnemy);
  drawPlayer(state.player);
  drawParticles();

  // Level banner
  if (state.tick < 90) {
    const a = state.tick < 60 ? 1 : 1 - (state.tick - 60) / 30;
    const gc = state.glowColor || '#0ff';
    ctx.globalAlpha = a;
    ctx.font = '900 1.4rem Orbitron, monospace';
    ctx.fillStyle = gc;
    ctx.textAlign = 'center';
    ctx.shadowColor = gc;
    ctx.shadowBlur = 20;
    ctx.fillText(`LEVEL ${state.level}  —  ${state.name || ''}`, W / 2, H / 2 - 10);
    ctx.font = '700 0.75rem Orbitron, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.shadowBlur = 0;
    ctx.fillText(`COLLECT ALL ORBS TO ADVANCE`, W / 2, H / 2 + 18);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

function loop() {
  if (!state) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

initStars();
</script>
</body>
</html>
